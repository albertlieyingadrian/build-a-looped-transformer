name: test
on:
  push:
  pull_request:
jobs:
  solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch and the rest
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Every solution passes its stage
        run: make test-solutions PY=python
